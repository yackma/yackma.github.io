        <div class="section-title">
            <b><tt><h2 style="color:coral;">Random Character</h2></tt></b>
        </div>
        <hr/>
        <div style="text-align:center;">
            <button onclick="getRandomCharacter()">Get Random Character</button>
        </div>
        <br/>
        <div id="randomResult"></div>
    </div>

    <script>
    function getRandomCharacter() {
        document.getElementById("randomResult").innerHTML;
        var randomId = Math.floor(Math.random() * 9820) + 1;

        fetch("https://api.disneyapi.dev/character/" + randomId)
        .then(function(r) { return r.json(); })
        .then(function(json) {

            var c = json.data;
            if (!c || !c.name) {
                getRandomCharacter();
                return;
            }
            function fmt(arr) { return arr && arr.length ? arr.join(", ") : "None"; }
            document.getElementById("randomResult").innerHTML =
                "<div class='char-display'>" +
                    "<img src='" + c.imageUrl + "' alt='" + c.name + "'>" +
                    "<h3 style='color:coral; margin-top:15px;'>" + c.name + "</h3>" +
                    "<p><b style='color:coral;'>Films:</b> " + fmt(c.films) + "</p>" +
                    "<p><b style='color:coral;'>Short Films:</b> " + fmt(c.shortFilms) + "</p>" +
                    "<p><b style='color:coral;'>TV Shows:</b> " + fmt(c.tvShows) + "</p>" +
                    "<p><b style='color:coral;'>Video Games:</b> " + fmt(c.videoGames) + "</p>" +
                    "<p><b style='color:coral;'>Park Attractions:</b> " + fmt(c.parkAttractions) + "</p>"+
                    "<p><b style='color:coral;'>Allies:</b> " + fmt(c.allies) + "</p>" +

                    "<p><b style='color:coral;'>Enemies:</b> " + fmt(c.enemies) + "</p>" +
            "</div>";
        })
        .catch(function() {
         getRandomCharacter();
        });
    }
    </script>
