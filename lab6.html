    <br/>
    <div style="max-width:200px; margin:auto;"><b><tt><h1 style="color:lightcoral;">Cat Facts</h1></tt></b></div>
    <hr/>

    <div style="text-align:center;"><img src="Cat.png" alt="cat" class="img-fluid rounded" width="400" id="catPic"></div>
    <br/><br/>

    <div style="text-align:center; max-width:300px; margin:auto;">
        <button id="loadBtn" onclick="facts()">Learn Cat Facts Here!</button>
         <button id="backBtn" onclick="goBack()" style="display:none;">Go Back</button>
    </div>

    <br/><br/>
    <div id="tableArea" style="max-width:600px; margin:auto;"></div>


<script>
var catPic = "Cat.png";
function facts(){
    fetch('https://brianobruno.github.io/cats.json')
    .then(r => r.json())
    .then(data => {
        data.facts.sort(function(a, b) {
            return a.factId - b.factId;
        });
        document.images[0].src = data.catPhoto;

        var tabDiv = document.getElementById("tableArea");
        var table= "<table style='border-collapse:collapse; margin:auto; width:500px; text-align:center;' border='10'>"  +
        "<tr><th style='border:1px solid black;'>Fact ID</th><th style='border:1px solid black;'>Facts</th></tr>";

        for (var i = 0; i < data.facts.length;i++){
            table +=
                "<tr>"+"<td style='border:1px solid black;'>" + data.facts[i].factId +"</td>"      +"<td style='border:1px solid black;'>" + data.facts[i].text + "</td>" +"</tr>";
        }
        table += "</table>";
        tabDiv.innerHTML =table;

        var butn = document.body.getElementsByTagName("button");
        butn[0].style.display ="none";
        butn[1].style.display="inline-block";
    });
}

function goBack() {
    document.images[0].src = catPic;
    var tabDiv = document.getElementById("tableArea");
    tabDiv.innerHTML = "";

    var butn=document.body.getElementsByTagName("button");
    butn[0].style.display= "inline-block"; 
    butn[1].style.display ="none";
}
</script>
