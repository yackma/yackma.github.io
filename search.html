    <div style="padding:20px;">
        <div class="section-title">
            <b><tt><h2 style="color:coral;">Search Characters</h2></tt></b>
        </div>
        <hr/>
        <div class="search-box">
            <input id="searchInput" type="text" placeholder="Name">
            <input id="filterFilms" type="text" placeholder="Film">
            <input id="filterTV" type="text" placeholder="TV Show ">
            <input id="filterGames" type="text" placeholder="Video Game">
            <br/><br/>
            <button onclick="searchCharacters()">Search</button>
        </div>
        <br/>
        <div id="searchResults"></div>
    </div>

    <div class="modal" id="characterModal" tabindex="-1" style="background:rgba(0,0,0,0.7);">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom">
                <div class="modal-body">
                    <h3 id="charName" style="color:coral; text-align:center;"></h3>
                    <p id="charId" style="text-align:center; color:lightgray;"></p>
                    <div style="text-align:center;">
                        <img id="charImage" style="width:75%; border-radius:8px;">
                    </div>
                    <br/>
                    <p><b style="color:coral;">Films:</b> <span id="charFilms"></span></p>
                    <p><b style="color:coral;">TV Shows:</b> <span id="charTV"></span></p>
                    <p><b style="color:coral;">Video Games:</b> <span id="charGames"></span></p>
                    <p><b style="color:coral;">Park Attractions:</b> <span id="charParks"></span></p>
                    <p><b style="color:coral;">Allies:</b> <span id="charAllies"></span></p>
                    <p><b style="color:coral;">Enemies:</b> <span id="charEnemies"></span></p>
                    <div style="text-align:center;">
                        <button data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function searchCharacters() {
        var name = document.getElementById("searchInput").value.trim();
        var films = document.getElementById("filterFilms").value.trim();
        var tv = document.getElementById("filterTV").value.trim();
        var games = document.getElementById("filterGames").value.trim();

        var query = "https://api.disneyapi.dev/character?";
        if (name) query += "name="+ name +"&";
        if (films) query += "films="+ films + "&";
        if (tv) query += "tvShows="+ tv +"&";
        if (games) query += "videoGames=" + games + "&";

        fetch(query)
        .then(function(r) { return r.json(); })
        .then(function(json) {
            var container = document.getElementById("searchResults");
            container.innerHTML = "";
            if (!json.data || json.data.length === 0) {
                container.innerHTML = "<p style='color:black;'>No results found.</p>";
                return;
            }
            for (var i = 0; i < json.data.length; i++) {
                container.innerHTML += makeCard(json.data[i]);
            }
        });
    }

    function makeCard(char) {
        return "<div class='char-card' onclick='openCharacter(" + char._id + ")'>" +
            "<img src='" + char.imageUrl + "' alt='" + char.name + "'>" +
            "<p style='margin-top:8px;'><b>" + char.name + "</b></p>" +
            "</div>";
    }

    function openCharacter(id) {
        fetch("https://api.disneyapi.dev/character/" + id)
        .then(function(r) { return r.json(); })
        .then(function(json) {

            var c = json.data;
            document.getElementById("charName").innerText = c.name;
            document.getElementById("charId").innerText = "ID: " + c._id;
            document.getElementById("charImage").src = c.imageUrl;
            function fmt(arr) { return arr && arr.length ? arr.join(", ") : "None"; }
            document.getElementById("charFilms").innerText = fmt(c.films);
            document.getElementById("charTV").innerText = fmt(c.tvShows);
            document.getElementById("charGames").innerText = fmt(c.videoGames);
            document.getElementById("charParks").innerText = fmt(c.parkAttractions);
            document.getElementById("charAllies").innerText = fmt(c.allies);
            document.getElementById("charEnemies").innerText = fmt(c.enemies);
            new bootstrap.Modal(document.getElementById("characterModal")).show();
        });
    }


    </script>
