    <div style="padding:20px;">
        <div class="section-title">
            <b><tt><h2 style="color:coral;">Character of the Day</h2></tt></b>
        </div>
        <hr/>
        <p style="color:black; text-align:center;">Check back every day for a new Disney character!</p>
        <div style="text-align:center;">
            <button onclick="getCharacterOfTheDay()">Reveal Character of the Day</button>
        </div>
        <br/>
        <div id="dailyResult"></div>
    </div>

    <script>
    function getTodayKey() {
        var now = new Date();
        return now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
    }

    function getCharacterOfTheDay() {
        var today = getTodayKey();
        var savedDate = localStorage.getItem("dailyDate");
        var savedChar = localStorage.getItem("dailyCharacter");
        if (savedDate === today && savedChar) {
            showDailyCharacter(JSON.parse(savedChar));
            return;
        }

        document.getElementById("dailyResult").innerHTML = "<p style='color:black; text-align:center;'>Loading...</p>";

        var now = new Date();
        var seed = now.getFullYear() * 10000 +(now.getMonth() + 1)*100 + now.getDate();
        var dailyId = (seed % 9820) + 1;
        fetch("https://api.disneyapi.dev/character/" + dailyId)
        .then(function(r) { return r.json(); })
        .then(function(json) {
            var c = json.data;
            if (!c ||!c.name) {
                fetch("https://api.disneyapi.dev/character/" + (dailyId + 1))
                .then(function(r2) { return r2.json(); })
                .then(function(json2) {
                    localStorage.setItem("dailyCharacter", JSON.stringify(json2.data));
                    localStorage.setItem("dailyDate", today);
                    showDailyCharacter(json2.data);
                });
                return;
            }
            localStorage.setItem("dailyCharacter", JSON.stringify(c));
            localStorage.setItem("dailyDate", today);
            showDailyCharacter(c);


        });
    }

    function showDailyCharacter(c) {
        function fmt(arr) { return arr && arr.length ? arr.join(", ") : "None"; }
        document.getElementById("dailyResult").innerHTML =
            "<div class='char-display'>" +
                "<img src='" + c.imageUrl + "' alt='" + c.name + "'>" +
                "<h3 style='color:coral; margin-top:15px;'>" + c.name + "</h3>" +
                "<p><b style='color:coral;'>Films:</b> " + fmt(c.films) + "</p>" +
                "<p><b style='color:coral;'>Short Films:</b> " + fmt(c.shortFilms) + "</p>" +
                "<p><b style='color:coral;'>TV Shows:</b> " + fmt(c.tvShows) + "</p>" +
                "<p><b style='color:coral;'>Video Games:</b> " + fmt(c.videoGames) + "</p>" +
                "<p><b style='color:coral;'>Park Attractions:</b> " + fmt(c.parkAttractions) + "</p>" +
                "<p><b style='color:coral;'>Allies:</b> " + fmt(c.allies) + "</p>" +
                "<p><b style='color:coral;'>Enemies:</b> " + fmt(c.enemies) + "</p>" +
            "</div>";
    }
    </script>
